name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NO_COLOR: '1'
  CGO_ENABLED: '0'

jobs:
  lint:
    name: Lint (Go & TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Install Node dependencies
        working-directory: web-app
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/worker-python/uv.lock"

      - name: Install Python dependencies
        working-directory: services/worker-python
        run: uv sync --frozen --all-extras

      - name: Install Task CLI
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install templ CLI
        run: curl -sSL https://github.com/a-h/templ/releases/download/v0.3.1020/templ_Linux_x86_64.tar.gz | tar -xz -C $(go env GOPATH)/bin templ

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2

      - name: Generate Templ files
        run: task generate

      - name: Run Linters via Taskfile
        run: task lint

  test:
    name: Test (Unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/worker-python/uv.lock"

      - name: Install Python dependencies
        working-directory: services/worker-python
        run: uv sync --frozen --all-extras

      - name: Install Task CLI
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install templ CLI
        run: curl -sSL https://github.com/a-h/templ/releases/download/v0.3.1020/templ_Linux_x86_64.tar.gz | tar -xz -C $(go env GOPATH)/bin templ

      - name: Generate Templ files
        run: task generate

      - name: Run Unit Tests
        run: task test:unit

  build:
    name: Build (Front & Binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Install Node dependencies
        working-directory: web-app
        run: npm ci

      - name: Install Task CLI
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install templ CLI
        run: curl -sSL https://github.com/a-h/templ/releases/download/v0.3.1020/templ_Linux_x86_64.tar.gz | tar -xz -C $(go env GOPATH)/bin templ

      - name: Build All Targets via Taskfile
        run: task build

  ci-gate:
    name: CI Gate
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Checks Passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "Une ou plusieurs verifications CI ont echoue."
            exit 1
          fi
          echo "Toutes les etapes CI sont validees avec succes."
