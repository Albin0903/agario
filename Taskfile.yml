version: '3'

env:
  CGO_ENABLED: '0'
  NO_COLOR: '1'

vars:
  BINARY_NAME: server
  BINARY_PATH: ./tmp/{{.BINARY_NAME}}{{exeExt}}
  GO_MODULE: github.com/albin/build

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all
    silent: true

  # ─── Initialization ───────────────────────────────────────
  init:
    desc: Initialize a new project from template with a custom module name
    vars:
      NEW_MODULE: '{{.CLI_ARGS | default "github.com/Albin0903/new-project"}}'
    cmds:
      - go run scripts/init.go {{.NEW_MODULE}}
      - task: generate
      - go mod tidy
      - task: fmt

  # ─── Generation ───────────────────────────────────────────
  generate:
    desc: Generate Templ templates and static assets
    cmds:
      - templ generate
    sources:
      - 'internal/**/*.templ'
    generates:
      - 'internal/**/*_templ.go'

  # ─── Formatting ───────────────────────────────────────────
  fmt:
    desc: Auto-format all Go, Templ, TypeScript, and Python code
    cmds:
      - task: fmt:templ
      - task: fmt:go
      - task: fmt:ts
      - task: fmt:python

  fmt:templ:
    desc: Format Templ files
    cmds:
      - templ fmt internal/

  fmt:go:
    desc: Format Go files
    cmds:
      - golangci-lint run --fix ./...

  fmt:ts:
    desc: Format TypeScript and CSS with Biome
    dir: web-app
    cmds:
      - npx @biomejs/biome check --write src/

  fmt:python:
    desc: Format Python code with Ruff
    dir: services/worker-python
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  # ─── Linting ──────────────────────────────────────────────
  lint:
    desc: Run all linters
    cmds:
      - task: lint:go
      - task: lint:ts
      - task: lint:design
      - task: lint:python

  lint:go:
    desc: Run Go linter
    cmds:
      - golangci-lint run ./...

  lint:ts:
    desc: Run TypeScript linter (Biome)
    dir: web-app
    cmds:
      - npx @biomejs/biome check --no-errors-on-unmatched src/

  lint:design:
    desc: Audit design token compliance (no arbitrary Tailwind values)
    cmds:
      - pwsh -NoProfile -File scripts/lint-design.ps1

  lint:python:
    desc: Run Python linter and static type checker
    dir: services/worker-python
    cmds:
      - uv run ruff check .
      - uv run mypy worker_python

  # ─── Testing ──────────────────────────────────────────────
  test:unit:
    desc: Run unit tests
    cmds:
      - go test -v -count=1 ./internal/...
      - task: test:python

  test:python:
    desc: Run Python worker unit tests
    dir: services/worker-python
    cmds:
      - uv run pytest -v

  test:integration:
    desc: Run integration tests (Testcontainers)
    cmds:
      - go test -v -count=1 -tags=integration ./tests/integration/...

  test:e2e:
    desc: Run comprehensive E2E requirement and scenario test suite
    cmds:
      - pwsh -NoProfile -File tests/e2e/runner.ps1

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:e2e

  # ─── Building ─────────────────────────────────────────────
  build:front:
    desc: Build TypeScript/Vite frontend
    dir: web-app
    cmds:
      - npm run build
    sources:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'

  build:bin:
    desc: Build static Go binary
    cmds:
      - go build -buildvcs=false -ldflags="-s -w" -o {{.BINARY_PATH}} ./cmd/server/
    env:
      CGO_ENABLED: '0'
      GOFLAGS: ''
    sources:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    generates:
      - '{{.BINARY_PATH}}'

  build:
    desc: Build everything
    cmds:
      - task: generate
      - task: build:front
      - task: build:bin

  # ─── Docker ───────────────────────────────────────────────
  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -t {{.GO_MODULE}}:latest -f build/Dockerfile .

  docker:run:
    desc: Run Docker container
    cmds:
      - docker run --rm -p 8080:8080 {{.GO_MODULE}}:latest

  # ─── Full Pipeline ────────────────────────────────────────
  check:
    desc: Full validation pipeline (generate -> lint -> test -> build:front -> build:bin)
    cmds:
      - task: generate
      - task: lint
      - task: test:unit
      - task: build:front
      - task: build:bin

  # ─── Development ──────────────────────────────────────────
  dev:
    desc: Run development server with pre-generated templates
    cmds:
      - task: generate
      - go run -buildvcs=false ./cmd/server/
    env:
      CGO_ENABLED: '0'

  dev:front:
    desc: Run TypeScript/Vite development server with HMR
    dir: web-app
    cmds:
      - npm run dev

  clean:
    desc: Clean build artifacts
    cmds:
      - cmd: rm -rf tmp/
        platforms: [linux, darwin]
      - cmd: if exist tmp rd /s /q tmp
        platforms: [windows]
      - cmd: rm -rf web-app/dist/
        platforms: [linux, darwin]
      - cmd: if exist web-app\dist rd /s /q web-app\dist
        platforms: [windows]
