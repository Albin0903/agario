# AGAR-RL PPO & Self-Play Configuration
# High-Throughput L4 GPU Maximized Configuration (Option 2 + Option 3)

ppo:
  learning_rate: 0.0003
  n_steps: 2048                 # Horizon per worker = 2048 (Guide Section 6)
  batch_size: 1024              # Maximize L4 tensor core utilization
  n_epochs: 8                   # Epochs per rollout
  gamma: 0.99                   # Discount factor for long-term survival
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.002               # Balanced exploration (preserves BC warm-start without catastrophic uniform drift)
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 15000000     # 15M timesteps (~30-40 min on GPU L4 @ 6000-8000 FPS)

policy:
  net_arch:
    pi: [512, 512, 512]         # Deep 3x512 representation for spatial reasoning
    vf: [512, 512, 512]
  activation_fn: "ReLU"

self_play:
  update_interval_steps: 250000   # Save to pool every 250K steps
  max_pool_size: 20
  history_dir: "checkpoints/self_play_pool"
  save_dir: "checkpoints/ppo"
  heuristic_opponent_ratio: 0.5   # 50% disciplined heuristic, 50% self-play pool

training:
  n_envs: 24                    # 24 vectorized environments for parallel CPU rollouts
  eval_freq: 25000
  eval_episodes: 5
  seed: 42
