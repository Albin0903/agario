# AGAR-RL PPO & Self-Play Configuration
# High-Throughput NVIDIA A100 Configuration

ppo:
  learning_rate: 0.0003
  learning_rate_end: 0.00001    # Cosine annealing floor (3e-4 -> 1e-5)
  lr_schedule: cosine
  n_steps: 2048                 # Horizon per worker = 2048 (Guide Section 6)
  batch_size: 1024              # Best measured Colab A100 profile
  n_epochs: 10                  # More reuse of the large A100 rollout
  gamma: 0.99                   # Discount factor for long-term survival
  gae_lambda: 0.95
  clip_range: 0.2
  target_kl: 0.05               # Stop an update before destructive policy drift
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.005               # Initial exploration coefficient
  ent_coef_end: 0.001            # Annealed coefficient at the end of training
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 20000000     # V10 target horizon

policy:
  features_dim: 512             # LayerNorm/RMSNorm trunk width
  norm: layernorm               # layernorm | rmsnorm
  net_arch:
    pi: [512, 512, 512]         # Deep 3x512 representation for spatial reasoning
    vf: [512, 512, 512]
  activation_fn: "SiLU"

self_play:
  update_interval_steps: 250000   # Save to pool every 250K steps
  max_pool_size: 20
  history_dir: "checkpoints/self_play_pool"
  save_dir: "checkpoints/ppo"
  heuristic_opponent_ratio: 0.3   # 30% deterministic heuristic opponents
  current_opponent_ratio: 0.2     # 20% latest policy clone; remaining 50% uses PFSP
  pfsp_power: 1.5                 # Difficulty weighting exponent in [1, 2]

training:
  n_envs: 8                     # Best measured profile; more workers reduce throughput
  eval_freq: 25000
  eval_episodes: 5
  seed: 42
