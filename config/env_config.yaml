# AGAR-RL V3 Environment Configuration
# SOTA Minimalist Formulation (AgarCL / AgarIA standard)

arena:
  width: 1400.0               # Balanced arena for 20 bots
  height: 1400.0

physics:
  v_base: 3.5
  v_min: 0.8
  v_mass_exponent: -0.2
  radius_scale: 3.0            # r = sqrt(m) * 3
  eat_ratio: 1.1               # m_A >= 1.1 * m_B to consume
  initial_player_mass: 20.0
  min_cell_mass: 10.0
  max_subcells: 16
  remerge_cooldown_ticks: 600
  remerge_cooldown_mass_factor: 0.5
  split_boost_speed: 26.0
  split_boost_decay: 0.90
  eject_loss_mass: 16.0
  eject_spawn_mass: 12.0
  eject_speed: 18.0
  min_decay_mass: 100.0
  mass_decay_rate: 0.00003

entities:
  num_pellets: 2000             # Dense food field for constant growth
  pellet_mass: 1.0
  num_viruses: 8                # Authentic virus hazards and shields
  virus_mass: 100.0
  virus_radius: 24.0
  virus_split_threshold: 140.0

observation:
  view_radius_base: 500.0
  view_radius_scale: 2.0       # R_vue = 500 + 2 * r_c
  num_pellets_obs: 10           # 10 * 2 = 20 floats
  num_prey_obs: 5               # 5 * 4 = 20 floats
  num_predator_obs: 5           # 5 * 4 = 20 floats
  num_virus_obs: 4              # 4 * 3 = 12 floats
  total_dims: 84

action:
  action_type: "multidiscrete"  # "multidiscrete" (24 angles + 3 discrete triggers) or "continuous" (Box 3)
  num_angles: 24                # 360 / 24 = 15 degrees resolution

rewards:
  mass_scale: 1.0               # Delta mass scaling
  kill_reward: 10.0             # Combat payoff for eliminating opponent
  death_penalty_max: 5.0        # Moderate terminal penalty (prevents paralysis)

simulation:
  max_steps: 3500               # Match length in ticks
  num_bots: 20                  # SOTA dense multi-agent arena
  spatial_grid_cell_size: 100.0 # Fast spatial hashing
