# AGAR-RL Environment Configuration
# Optimized for fast PPO learning on T4 GPU

arena:
  width: 1200.0               # Smaller arena = denser encounters, faster learning
  height: 1200.0

physics:
  v_base: 3.2
  v_min: 0.8
  v_mass_exponent: -0.2
  radius_scale: 3.0            # r = sqrt(m) * 3
  eat_ratio: 1.1               # m_A >= 1.1 * m_B to consume
  initial_player_mass: 20.0
  min_cell_mass: 10.0
  max_subcells: 16
  remerge_cooldown_ticks: 600
  remerge_cooldown_mass_factor: 0.5
  split_boost_speed: 24.0
  split_boost_decay: 0.90
  eject_loss_mass: 16.0
  eject_spawn_mass: 12.0
  eject_speed: 18.0
  min_decay_mass: 100.0
  mass_decay_rate: 0.00003

entities:
  num_pellets: 1500             # Denser pellets = faster mass accumulation
  pellet_mass: 1.0
  num_viruses: 6                # Fewer viruses in smaller arena
  virus_mass: 100.0
  virus_radius: 20.0
  virus_split_threshold: 140.0

observation:
  view_radius_base: 500.0
  view_radius_scale: 2.0       # R_vue = 500 + 2 * r_c
  num_pellets_obs: 10           # 10 * 2 = 20 floats
  num_prey_obs: 5               # 5 * 4 = 20 floats
  num_predator_obs: 5           # 5 * 4 = 20 floats
  num_virus_obs: 4              # 4 * 3 = 12 floats
  total_dims: 84

rewards:
  mass_scale: 3.0               # Sqrt(mass) growth as primary signal
  pellet_reward: 0.2            # Strong per-pellet bonus for early food-seeking
  eat_cell_reward: 15.0         # Big payoff for eating opponents
  death_penalty: -5.0           # Moderate: harsh enough to learn, but doesn't drown gradient
  inefficient_split_penalty: 1.5 # Penalize random splits that do not yield cells
  split_eval_window: 40
  survival_reward: 0.001        # Tiny baseline
  proximity_pellet_reward: 0.04 # Dense gradient: reward for approaching nearest food

simulation:
  max_steps: 3500               # ~60 seconds of gameplay at 60 FPS (allows merging & virus tactics)
  num_bots: 5                   # Balanced density for tactical interactions
  spatial_grid_cell_size: 80.0  # Smaller grid cells for smaller arena
