# AGAR-RL simulation parameters.
# Miniclip publishes the gameplay objective but not these numeric physics constants;
# see docs/V11_DESIGN.md for the source/provenance boundary.

arena:
  width: 1400.0               # Balanced arena for 20 bots
  height: 1400.0

physics:
  v_base: 3.5
  v_min: 0.8
  v_mass_exponent: -0.2
  radius_scale: 3.0            # Simulation approximation; official radius curve is unpublished
  eat_ratio: 1.1               # Simulation approximation; official numeric eat threshold is unpublished
  initial_player_mass: 20.0
  min_cell_mass: 10.0
  min_split_mass: 36.0          # Configurable approximation; official threshold is not published
  max_subcells: 16              # Simulation cap; verify against the chosen official client/mode
  max_cell_mass: 2250.0         # Simulation cap; official value is not published
  remerge_cooldown_ticks: 600   # Simulation ticks; official cooldown is not published
  remerge_cooldown_mass_factor: 0.5
  split_boost_speed: 26.0
  split_boost_decay: 0.90
  eject_loss_mass: 16.0        # Simulation approximation
  eject_spawn_mass: 12.0       # Simulation approximation
  eject_speed: 18.0            # Simulation units/tick
  min_decay_mass: 100.0         # Simulation approximation
  mass_decay_rate: 0.002        # User-selected 0.2%/simulated-second approximation; not an official published rate

entities:
  num_pellets: 2000             # Dense food field for constant growth
  pellet_mass: 1.0
  num_viruses: 8                # Training arena population, not a published Classic-mode constant
  virus_mass: 100.0
  virus_radius: 24.0
  virus_split_threshold: 130.0 # Simulation approximation; official threshold is not published

observation:
  view_radius_base: 500.0
  view_radius_scale: 2.0       # R_vue = 500 + 2 * r_c
  num_pellets_obs: 10           # 10 * 2 = 20 floats
  num_prey_obs: 5               # 5 * 4 = 20 floats
  num_predator_obs: 5           # 5 * 4 = 20 floats
  num_virus_obs: 4              # 4 * 3 = 12 floats
  total_dims: 84

action:
  action_type: "multidiscrete"  # "multidiscrete" (24 angles + 3 discrete triggers) or "continuous" (Box 3)
  num_angles: 24                # 360 / 24 = 15 degrees resolution

rewards:
  mass_scale: 1.0               # Signed delta mass: growth positive, loss negative
  peak_mass_scale: 1.0          # Additional reward for exceeding the episode peak
  death_penalty_max: 10.0       # Terminal penalty on being eaten

simulation:
  max_steps: 3500               # RL decisions per episode
  tick_duration_seconds: 0.04   # 25 physics ticks per simulated second
  action_repeat: 3              # 3 physics ticks per RL decision; episode horizon = 420 simulated seconds
  num_bots: 20                  # SOTA dense multi-agent arena
  spatial_grid_cell_size: 100.0 # Fast spatial hashing
